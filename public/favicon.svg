<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- 
    32x32 Original Pixel Art Favicon for "Legends of Aetheria"
    Completely custom fantasy motif — zero proprietary assets.
  -->
  <defs>
    <!-- Palette Info: 
         Dark Box: #120e17, Inner Frame: #221a2b
         Aether Purple Crystal: Light (#E274FF), Mid (#9E26CC), Dark (#4B0A66)
         Legend Gold: Light (#FFE366), Mid (#D19E00), Dark (#7A5300)
         Blade Steel: Light (#FFFFFF), Mid (#A3B8CC), Dark (#4E6375)
    -->
  </defs>

  <!-- 1. Dark Retro Inventory Box Frame -->
  <path d="M 2 2 L 30 2 L 30 30 L 2 30 Z" fill="#120e17" />
  <path d="M 3 3 L 29 3 L 29 29 L 3 29 Z" fill="#221a2b" />
  <path d="M 4 4 L 28 4 L 28 28 L 4 28 Z" fill="#181c2b" />

  <!-- 2. Mystical Summoning Circle Background Grid -->
  <path d="M 9 16 L 23 16 M 16 9 L 16 23" stroke="#4B0A66" stroke-width="1" />
  <path d="M 11 11 L 21 11 L 21 21 L 11 21 Z" fill="none" stroke="#4B0A66" stroke-width="1" />

  <!-- 3. Giant Geometric "A" Shard (Ethereal Crystal Frame) -->
  <!-- Left Pillar of the A -->
  <path d="M 9 24 L 11 24 L 11 26 L 9 26 Z M 10 20 L 12 20 L 12 24 L 10 24 Z M 11 16 L 13 16 L 13 20 L 11 20 Z M 12 12 L 14 12 L 14 16 L 12 16 Z" fill="#4B0A66" />
  <path d="M 10 24 L 11 24 L 11 26 L 10 26 Z M 11 20 L 12 20 L 12 24 L 11 24 Z M 12 16 L 13 16 L 13 20 L 12 20 Z M 13 12 L 14 12 L 14 16 L 13 16 Z" fill="#E274FF" />
  
  <!-- Right Pillar of the A -->
  <path d="M 21 24 L 23 24 L 23 26 L 21 26 Z M 20 20 L 22 20 L 22 24 L 20 24 Z M 19 16 L 21 16 L 21 20 L 19 20 Z M 18 12 L 20 12 L 20 16 L 18 16 Z" fill="#4B0A66" />
  <path d="M 21 24 L 22 24 L 22 26 L 21 26 Z M 20 20 L 21 20 L 21 24 L 20 24 Z M 19 16 L 20 16 L 20 20 L 19 20 Z M 18 12 L 19 12 L 19 16 L 18 16 Z" fill="#9E26CC" />

  <!-- Horizontal Crystal Crossbar for the A -->
  <path d="M 12 18 L 20 18 L 20 19 L 12 19 Z" fill="#9E26CC" />
  <path d="M 13 18 L 19 18 L 19 19 L 13 19 Z" fill="#E274FF" />

  <!-- 4. The Centerpiece: Capturing Core / Monster Snaring Crystal -->
  <!-- A diamond-cut central gem acting as your game's unique taming matrix -->
  <path d="M 13 14 L 19 14 L 17 11 L 15 11 Z" fill="#9E26CC" />
  <path d="M 13 15 L 19 15 L 17 18 L 15 18 Z" fill="#4B0A66" />
  <!-- Shimmer Highlights on Core -->
  <path d="M 14 14 L 16 12 L 15 12 Z" fill="#E274FF" />
  <rect x="15" y="14" width="2" height="1" fill="#FFFFFF" />

  <!-- 5. The Aetheria Fantasy Sword (Piercing down through the Apex) -->
  <!-- Blade -->
  <path d="M 15 5 L 17 5 L 17 11 L 15 11 Z" fill="#4E6375" />
  <path d="M 15 6 L 16 6 L 16 11 L 15 11 Z" fill="#FFFFFF" />
  <path d="M 16 5 L 17 5 L 17 10 L 16 10 Z" fill="#A3B8CC" />
  <rect x="15" y="4" width="2" height="1" fill="#FFFFFF" /> <!-- Sharp Point -->

  <!-- Golden Guard & Hilt Details -->
  <path d="M 13 11 L 19 11 L 19 12 L 13 12 Z" fill="#7A5300" />
  <path d="M 14 11 L 18 11 L 18 12 L 14 12 Z" fill="#FFE366" />
  <rect x="15" y="12" width="2" height="2" fill="#D19E00" /> <!-- Pommel inside gem -->

  <!-- 6. Corner Decorative Frame Accents (Classic 2D RPG UI) -->
  <rect x="4" y="4" width="2" height="2" fill="#D19E00" />
  <rect x="26" y="4" width="2" height="2" fill="#D19E00" />
  <rect x="4" y="26" width="2" height="2" fill="#D19E00" />
  <rect x="26" y="26" width="2" height="2" fill="#D19E00" />
</svg>
